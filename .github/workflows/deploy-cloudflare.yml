name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Validate and deploy MH Fashion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check required Cloudflare secrets
        shell: bash
        env:
          HAS_CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN != '' }}"
          HAS_CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}"
        run: |
          set -euo pipefail
          missing=0
          if [[ "$HAS_CLOUDFLARE_API_TOKEN" != "true" ]]; then
            echo "Missing repository secret: CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [[ "$HAS_CLOUDFLARE_ACCOUNT_ID" != "true" ]]; then
            echo "Missing repository secret: CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            echo "Add the missing GitHub Actions secrets before deploying."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --workspace=apps/web --omit=dev --audit-level=moderate

      - name: Lint the web app
        run: npm run lint --workspace=apps/web

      - name: Build Next.js application
        run: npm run build --workspace=apps/web

      - name: Run the full test suite against a production build
        shell: bash
        run: |
          set -euo pipefail
          stop_tree() {
            local parent="$1" child
            while read -r child; do
              [[ -n "$child" ]] || continue
              stop_tree "$child"
            done < <(ps -o pid= --ppid "$parent" || true)
            kill "$parent" 2>/dev/null || true
          }
          npm run start --workspace=apps/web -- --hostname 127.0.0.1 --port 3000 > /tmp/mhfashion-next.log 2>&1 &
          server_pid=$!
          cleanup() {
            stop_tree "$server_pid"
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl --max-time 2 -fsS http://127.0.0.1:3000/manus-routes.json >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" -ne 1 ]]; then
            cat /tmp/mhfashion-next.log
            exit 1
          fi
          # Plan §19.5: the suite that exists is the suite that runs. The HTTP tests inside it need this
          # server, so it starts once here and the whole file set runs against it.
          MH_TEST_ORIGIN=http://127.0.0.1:3000 GUIDE_TEST_ORIGIN=http://127.0.0.1:3000 \
            node --test tests/*.test.cjs

      - name: Type-check web app
        run: npx tsc -p apps/web/tsconfig.json --noEmit --incremental false --pretty false

      - name: Build OpenNext Worker
        run: npm run cf:build --workspace=apps/web

      - name: Validate Worker bundle
        working-directory: apps/web
        run: npx wrangler deploy --dry-run

      - name: Deploy Worker
        if: ${{ github.ref == 'refs/heads/main' }}
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Plan §19.5 item 3: a green run used to mean only that the build compiled. These four URLs are the
      # shop's own smoke test, and a failure names the URL it probed and the command that rolls back.
      - name: Smoke the deployed Worker
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://mhfashion.mhfashionmm.workers.dev"
          failed=0
          for path in "/" "/nyein" "/products" "/create" "/admin/login"; do
            code=$(curl -s -o /dev/null --max-time 20 -w "%{http_code}" "$base$path" || echo "000")
            echo "$path -> $code"
            if [[ "$code" != "200" ]]; then
              echo "::error::$base$path answered $code after the deploy. Roll back with: cd apps/web && npx wrangler rollback"
              failed=1
            fi
          done
          exit "$failed"
