name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy mhfashion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check required Cloudflare secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "Missing repository secret: CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Missing repository secret: CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            echo "Add the missing GitHub Actions secrets before deploying."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check web app
        run: npx tsc -p apps/web/tsconfig.json --noEmit --incremental false --pretty false

      - name: Build OpenNext Worker
        working-directory: apps/web
        run: npx opennextjs-cloudflare build

      - name: Deploy Worker
        working-directory: apps/web
        run: npx wrangler deploy
