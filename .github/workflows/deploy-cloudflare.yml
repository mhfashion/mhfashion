name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Validate and deploy MH Fashion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check required Cloudflare secrets
        shell: bash
        env:
          HAS_CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN != '' }}"
          HAS_CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}"
        run: |
          set -euo pipefail
          missing=0
          if [[ "$HAS_CLOUDFLARE_API_TOKEN" != "true" ]]; then
            echo "Missing repository secret: CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [[ "$HAS_CLOUDFLARE_ACCOUNT_ID" != "true" ]]; then
            echo "Missing repository secret: CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            echo "Add the missing GitHub Actions secrets before deploying."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --workspace=apps/web --omit=dev --audit-level=moderate

      - name: Run guide regression tests
        run: npm run test:guide

      - name: Run browser interaction guard tests
        run: npm run test:browser-guards

      - name: Build Next.js application
        run: npm run build --workspace=apps/web

      - name: Run production HTTP regression tests
        shell: bash
        run: |
          set -euo pipefail
          stop_tree() {
            local parent="$1" child
            while read -r child; do
              [[ -n "$child" ]] || continue
              stop_tree "$child"
            done < <(ps -o pid= --ppid "$parent" || true)
            kill "$parent" 2>/dev/null || true
          }
          npm run start --workspace=apps/web -- --hostname 127.0.0.1 --port 3000 > /tmp/mhfashion-next.log 2>&1 &
          server_pid=$!
          cleanup() {
            stop_tree "$server_pid"
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl --max-time 2 -fsS http://127.0.0.1:3000/manus-routes.json >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" -ne 1 ]]; then
            cat /tmp/mhfashion-next.log
            exit 1
          fi
          GUIDE_TEST_ORIGIN=http://127.0.0.1:3000 npm run test:guide:http

      - name: Type-check web app
        run: npx tsc -p apps/web/tsconfig.json --noEmit --incremental false --pretty false

      - name: Build OpenNext Worker
        run: npm run cf:build --workspace=apps/web

      - name: Validate Worker bundle
        working-directory: apps/web
        run: npx wrangler deploy --dry-run

      - name: Deploy Worker
        if: ${{ github.ref == 'refs/heads/main' }}
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
